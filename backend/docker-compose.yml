services:
  db:
    image: postgres:16-alpine
    container_name: vicini-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"  # 5433 on host to avoid conflict with any local Postgres on 5432
    volumes:
      - vicini-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vicini"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vicini-db-data:
